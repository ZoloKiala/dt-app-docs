site_name: Limpopo Digital Twin Portal
site_description: >-
  User guide and technical documentation for the TerriaJS WebGIS portal
  showcasing the Digital Twin (DT) of the Limpopo River Basin.
site_author: International Water Management Institute (IWMI)
site_url: https://iwmihq.github.io/dt-app-docs/
copyright: Copyright &copy; International Water Management Institute (IWMI)

docs_dir: docs
site_dir: site

# Surface broken cross-references. Combined with `mkdocs build --strict`,
# these become build failures rather than warnings.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  icon:
    logo: material/earth
    repo: fontawesome/brands/github
  # IWMI brand fonts are defined in stylesheets/extra.css, because the brand
  # body face (National) is commercial and needs a fallback stack that
  # theme.font cannot express. Disabling it stops Material loading Roboto.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    # navigation.instant is deliberately NOT enabled: it breaks the i18n
    # language switcher's contextual link, which would send readers to the
    # other language's home page instead of the page they were reading.
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tooltips

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  # Renders Material icon/emoji shortcodes (e.g. :octicons-arrow-right-24:) as
  # inline SVGs. Without this they show as literal text on buttons and cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  # `mermaid` fences render as diagrams (workflow charts on the Use Cases pages).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  # Order matters: i18n must follow search so it can localise the search index.
  - search:
      lang:
        - en
        - pt
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: pt
          name: Português
          build: true
          site_description: >-
            Guia do utilizador e documentação técnica do portal WebGIS TerriaJS
            que apresenta o Gémeo Digital (DT) da Bacia do Rio Limpopo.
          nav_translations:
            Home: Início
            User Guide: Guia do Utilizador
            Getting Started: Primeiros Passos
            Data Catalogue: Catálogo de Dados
            Dataset Themes: Temas dos Dados
            My Data: Os Meus Dados
            Workbench: Área de Trabalho
            Map Tools: Ferramentas do Mapa
            Stories & Sharing: Histórias e Partilha
            Help & Support: Ajuda e Apoio
            Water Copilot: Assistente Water Copilot
            Use Cases: Casos de Uso
            Irrigation water use: Uso de água na irrigação
            Floods: Cheias
            Droughts: Secas
            Environmental flows: Caudais ecológicos
            Reservoir monitoring: Monitorização de albufeiras
            Water accounting: Contabilidade da água
            El Niño season preparedness: Preparação para a época de El Niño
            Project: Projeto
            Technical Implementation: Implementação Técnica
            Development Process: Processo de Desenvolvimento
            Deployment & Maintenance: Implementação e Manutenção
            Reference: Referência
            Release Notes: Notas de Versão
            Glossary: Glossário
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true
      auto_caption: true
      caption_position: bottom

extra_css:
  - stylesheets/extra.css

extra:
  # Documentation versioning is managed by `mike`; the selector reads
  # versions.json from the deployment root. See README for the workflow.
  version:
    provider: mike
    default: latest
    alias: true
  portal_url: https://limpopo.digitaltwins.iwmi.org/
  social:
    - icon: material/email
      link: mailto:iwmigeospatial@gmail.com
      name: Contact the geospatial team
    - icon: material/web
      link: https://www.iwmi.cgiar.org/
      name: IWMI website

nav:
  - Home: index.md
  - User Guide:
      - guide/index.md
      - Getting Started: guide/getting-started.md
      - Data Catalogue: guide/data-catalogue.md
      - Dataset Themes: guide/datasets.md
      - My Data: guide/my-data.md
      - Workbench: guide/workbench.md
      - Map Tools: guide/map-tools.md
      - Stories & Sharing: guide/sharing.md
      - Help & Support: guide/help-support.md
      - Water Copilot: guide/water-copilot.md
  - Use Cases:
      - use-cases/index.md
      - Irrigation water use: use-cases/irrigation.md
      - Floods: use-cases/floods.md
      - Droughts: use-cases/droughts.md
      - Environmental flows: use-cases/eflows.md
      - Reservoir monitoring: use-cases/reservoirs.md
      - Water accounting: use-cases/water-accounting.md
      - El Niño season preparedness: use-cases/el-nino-preparedness.md
  - Project:
      - project/index.md
      - Technical Implementation: project/architecture.md
      - Development Process: project/development.md
      - Deployment & Maintenance: project/deployment.md
  - Reference:
      - reference/index.md
      - Release Notes: reference/release-notes.md
      - Glossary: reference/glossary.md
